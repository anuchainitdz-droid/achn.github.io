    <script>
        $( function() {
            $( "#sortable" ).sortable();
        } );

        function toggle_fullscreen() {
            if (!document.fullscreenElement && // alternative standard method
                !document.mozFullScreenElement && !document.webkitFullscreenElement) {  // current working methods
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.mozRequestFullScreen) {
                    document.documentElement.mozRequestFullScreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen(Element.ALLOW_KEYBOARD_INPUT);
                }
                document.body.setAttribute("fullscreen","") 
            } else {
                if (document.cancelFullScreen) {
                    document.cancelFullScreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.webkitCancelFullScreen) {
                    document.webkitCancelFullScreen();
                }
                document.body.removeAttribute("fullscreen") 
            }
        }
        function check_fullscreen() { // Because users can exit & enter fullscreen differently
            if (document.fullscreenElement || document.webkitIsFullScreen || document.mozFullScreen) { 
                document.body.setAttribute("fullscreen","") 
            } else { 
                document.body.removeAttribute("fullscreen") 
            }
        }
        setInterval(function(){ check_fullscreen();}, 1000);

        $("#add").click(function (e) {
            $("#sortable").append('<div class="input-group mt-1"><input type="text" aria-label="Channel name" placeholder="Channel name" name="cn[]" value="" class="form-control rounded-0"><span class="input-group-text"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M11.5 15a.5.5 0 0 0 .5-.5V2.707l3.146 3.147a.5.5 0 0 0 .708-.708l-4-4a.5.5 0 0 0-.708 0l-4 4a.5.5 0 1 0 .708.708L11 2.707V14.5a.5.5 0 0 0 .5.5zm-7-14a.5.5 0 0 1 .5.5v11.793l3.146-3.147a.5.5 0 0 1 .708.708l-4 4a.5.5 0 0 1-.708 0l-4-4a.5.5 0 0 1 .708-.708L4 13.293V1.5a.5.5 0 0 1 .5-.5z"/></svg></span><input type="text" aria-label="Broadcast slug" placeholder="Broadcast slug" name="vs[]" value="" class="form-control rounded-0"></div>');
        });

        document.querySelectorAll("video").forEach(video => {
            const src = video.getAttribute("src");
            if (Hls.isSupported()) {
                const hls = new Hls({
                    capLevelToPlayerSize: true,
                    startLevel: -1,
                    liveSyncDuration: 15,
                });
                hls.loadSource(src);
                hls.attachMedia(video);
            } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
                video.src = src;
            }
        });

        let deferredPrompt;
        let today = new Date().toISOString().slice(0, 10);
        let promptShownToday = localStorage.getItem('pwaPromptShownDate') === today;

        window.addEventListener('beforeinstallprompt', (e) => {
        if (window.matchMedia('(display-mode: standalone)').matches) {
            return;
        }

        if (promptShownToday) {
            return;
        }

        e.preventDefault();
        deferredPrompt = e;

        const banner = document.createElement('div');
        banner.id = 'pwa-banner';
        banner.innerHTML = `ZZZZ`;
        document.body.appendChild(banner);

        document.getElementById('pwa-install').addEventListener('click', async () => {
            deferredPrompt.prompt();
            await deferredPrompt.userChoice;
            localStorage.setItem('pwaPromptShownDate', today);
            document.getElementById('pwa-banner').remove();
            deferredPrompt = null;
        });

        document.getElementById('pwa-close').addEventListener('click', () => {
            localStorage.setItem('pwaPromptShownDate', today);
            document.getElementById('pwa-banner').remove();
            deferredPrompt = null;
        });
    });
</script>
